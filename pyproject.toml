[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "runic"
version = "0.1.0"
description = "Terrain-aware running playlist generator (GPX + ReccoBeats + Spotify)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "gpxpy>=1.6",
    "requests>=2.31",
    "python-dotenv>=1.0",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
web = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "python-multipart>=0.0.9",
    "itsdangerous>=2.1",
    "ytmusicapi>=1.8",
    "scikit-learn>=1.4",
]

[project.scripts]
runic = "runic.cli:main"
runic-web = "runic.web.app:run"

[tool.setuptools.packages.find]
include = ["runic*"]
